apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Points at whatever scrapes backend/src/config/tracing.ts's Prometheus
    # exporter (PROMETHEUS_PORT, default 9464, path /metrics). Override via
    # the GRAFANA_PROMETHEUS_URL env var substitution in your compose/helm
    # values — this default assumes a `prometheus` service on the same
    # network, as in a typical docker-compose/k8s scrape setup.
    url: http://prometheus:9090
    isDefault: true
    editable: true
