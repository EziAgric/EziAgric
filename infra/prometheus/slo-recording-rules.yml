# slo-recording-rules.yml
#
# Converts raw instrumented metrics into SLO SLI series (good ratio + error
# budget consumed) consumed by slo-alerting-rules.yml and the SLO dashboard.
# Mirrors the targets in docs/slo.md — keep in sync.

groups:
  - name: slo_recorded_slis
    interval: 30s
    rules:
      # ---------------------------------------------------------------- S1
      # API availability over a 28-day window. Good = status is not 5xx.
      - record: slo:S1:good_ratio:ratio_rate28d
        expr: |
          sum(rate(http_server_duration_milliseconds_count{http_status_code!~"5.."}[28d]))
            / clamp_min(sum(rate(http_server_duration_milliseconds_count[28d])), 1)
      - record: slo:S1:error_budget_consumed:ratio28d
        expr: |
          (1 - slo:S1:good_ratio:ratio_rate28d) / 0.001

      # Short-window good ratios (fed to the fast/slow burn-rate alerts).
      - record: slo:S1:good_ratio:ratio_rate1h
        expr: |
          sum(rate(http_server_duration_milliseconds_count{http_status_code!~"5.."}[1h]))
            / clamp_min(sum(rate(http_server_duration_milliseconds_count[1h])), 1)
      - record: slo:S1:good_ratio:ratio_rate6h
        expr: |
          sum(rate(http_server_duration_milliseconds_count{http_status_code!~"5.."}[6h]))
            / clamp_min(sum(rate(http_server_duration_milliseconds_count[6h])), 1)

      # ---------------------------------------------------------------- S2
      # API latency p95 <= 1000ms over a 28-day window.
      # Good = request completed under the 1000ms budget (le="1" bucket).
      - record: slo:S2:good_ratio:ratio_rate28d
        expr: |
          sum(rate(http_server_duration_milliseconds_bucket{le="1000"}[28d]))
            / clamp_min(sum(rate(http_server_duration_milliseconds_count[28d])), 1)
      - record: slo:S2:error_budget_consumed:ratio28d
        expr: |
          (1 - slo:S2:good_ratio:ratio_rate28d) / 0.05

      # Short-window good ratios (fed to the fast/slow burn-rate alerts).
      - record: slo:S2:good_ratio:ratio_rate1h
        expr: |
          sum(rate(http_server_duration_milliseconds_bucket{le="1000"}[1h]))
            / clamp_min(sum(rate(http_server_duration_milliseconds_count[1h])), 1)
      - record: slo:S2:good_ratio:ratio_rate6h
        expr: |
          sum(rate(http_server_duration_milliseconds_bucket{le="1000"}[6h]))
            / clamp_min(sum(rate(http_server_duration_milliseconds_count[6h])), 1)

      # ---------------------------------------------------------------- S3
      # Payout (release) success rate >= 99.5% over a 28-day window.
      # Good = escrow released to seller. Terminal settlements are the
      # denominator: released + refunded + disputed.
      - record: slo:S3:good_count:sum28d
        expr: |
          sum(increase(amana_trades_total{event="released"}[28d])) or vector(0)
      - record: slo:S3:total_count:sum28d
        expr: |
          sum(increase(amana_trades_total{event=~"released|refunded|disputed"}[28d])) or vector(0)
      - record: slo:S3:good_ratio:ratio28d
        expr: |
          slo:S3:good_count:sum28d / clamp_min(slo:S3:total_count:sum28d, 1)
      - record: slo:S3:error_budget_consumed:ratio28d
        expr: |
          (1 - slo:S3:good_ratio:ratio28d) / 0.005

      # Short-window good ratios (fed to the fast/slow burn-rate alerts).
      - record: slo:S3:good_ratio:ratio1h
        expr: |
          sum(increase(amana_trades_total{event="released"}[1h])) or vector(0)
            / clamp_min(sum(increase(amana_trades_total{event=~"released|refunded|disputed"}[1h])) or vector(0), 1)
      - record: slo:S3:good_ratio:ratio6h
        expr: |
          sum(increase(amana_trades_total{event="released"}[6h])) or vector(0)
            / clamp_min(sum(increase(amana_trades_total{event=~"released|refunded|disputed"}[6h])) or vector(0), 1)

      # ---------------------------------------------------------------- S4
      # Event-processing lag p95 <= 5 minutes over a 28-day window.
      - record: slo:S4:good_ratio:ratio_rate28d
        expr: |
          (sum(rate(event_listener_processing_lag_seconds_bucket{le="300"}[28d]))
            / clamp_min(sum(rate(event_listener_processing_lag_seconds_count[28d])), 1))
      - record: slo:S4:error_budget_consumed:ratio28d
        expr: |
          (1 - slo:S4:good_ratio:ratio_rate28d) / 0.05

      # Short-window good ratios (fed to the fast/slow burn-rate alerts).
      - record: slo:S4:good_ratio:ratio1h
        expr: |
          sum(rate(event_listener_processing_lag_seconds_bucket{le="300"}[1h]))
            / clamp_min(sum(rate(event_listener_processing_lag_seconds_count[1h])), 1)
      - record: slo:S4:good_ratio:ratio6h
        expr: |
          sum(rate(event_listener_processing_lag_seconds_bucket{le="300"}[6h]))
            / clamp_min(sum(rate(event_listener_processing_lag_seconds_count[6h])), 1)
