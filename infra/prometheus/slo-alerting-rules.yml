# slo-alerting-rules.yml
#
# Burn-rate alerts for the SLOs defined in docs/slo.md.
#
#   - Fast burn (1h, 1200x): would exhaust the 28-day budget in <= 1 hour -> page.
#   - Slow burn (6h, 9.3x):  would exhaust the 28-day budget in <= 3 days -> ticket.
#
# Each rule fires when `slo:<id>:error_budget_consumed:*` crosses the ratio
# implied by the burn window. Keep thresholds aligned with docs/slo.md.

groups:
  - name: slo_burn_rate
    rules:
      # ------------------------------------------------------------ S1
      - record: slo:S1:error_budget_consumed:ratio1h
        expr: |
          (1 - slo:S1:good_ratio:ratio_rate1h) / 0.001
      - record: slo:S1:error_budget_consumed:ratio6h
        expr: |
          (1 - slo:S1:good_ratio:ratio_rate6h) / 0.001
      - alert: SLOPE_BudgetBurn_Fast_S1
        expr: slo:S1:error_budget_consumed:ratio1h >= 1200
        for: 10m
        labels: { severity: page, slo: S1, runbook: docs/runbooks/slo-burn.md }
        annotations:
          summary: "S1 API availability error budget burning fast"
          description: "API 5xx rate would exhaust the 28-day budget in <= 1h ({{ $value }}x)."
      - alert: SLOPE_BudgetBurn_Slow_S1
        expr: slo:S1:error_budget_consumed:ratio6h >= 9.3
        for: 2h
        labels: { severity: ticket, slo: S1, runbook: docs/runbooks/slo-burn.md }
        annotations:
          summary: "S1 API availability error budget burning slowly"
          description: "API 5xx rate would exhaust the 28-day budget in <= 3 days ({{ $value }}x)."

      # ------------------------------------------------------------ S2
      - record: slo:S2:error_budget_consumed:ratio1h
        expr: |
          (1 - slo:S2:good_ratio:ratio_rate1h) / 0.05
      - record: slo:S2:error_budget_consumed:ratio6h
        expr: |
          (1 - slo:S2:good_ratio:ratio_rate6h) / 0.05
      - alert: SLOPE_BudgetBurn_Fast_S2
        expr: slo:S2:error_budget_consumed:ratio1h >= 1200
        for: 10m
        labels: { severity: page, slo: S2, runbook: docs/runbooks/slo-burn.md }
        annotations:
          summary: "S2 API latency error budget burning fast"
          description: "Latency p95 would exhaust the 28-day budget in <= 1h ({{ $value }}x)."
      - alert: SLOPE_BudgetBurn_Slow_S2
        expr: slo:S2:error_budget_consumed:ratio6h >= 9.3
        for: 2h
        labels: { severity: ticket, slo: S2, runbook: docs/runbooks/slo-burn.md }
        annotations:
          summary: "S2 API latency error budget burning slowly"
          description: "Latency p95 would exhaust the 28-day budget in <= 3 days ({{ $value }}x)."

      # ------------------------------------------------------------ S3
      - record: slo:S3:error_budget_consumed:ratio1h
        expr: |
          (1 - slo:S3:good_ratio:ratio1h) / 0.005
      - record: slo:S3:error_budget_consumed:ratio6h
        expr: |
          (1 - slo:S3:good_ratio:ratio6h) / 0.005
      - alert: SLOPE_BudgetBurn_Fast_S3
        expr: slo:S3:error_budget_consumed:ratio1h >= 1200
        for: 10m
        labels: { severity: page, slo: S3, runbook: docs/runbooks/slo-burn.md }
        annotations:
          summary: "S3 payout success error budget burning fast"
          description: "Non-released settlement rate would exhaust the 28-day budget in <= 1h ({{ $value }}x)."
      - alert: SLOPE_BudgetBurn_Slow_S3
        expr: slo:S3:error_budget_consumed:ratio6h >= 9.3
        for: 2h
        labels: { severity: ticket, slo: S3, runbook: docs/runbooks/slo-burn.md }
        annotations:
          summary: "S3 payout success error budget burning slowly"
          description: "Non-released settlement rate would exhaust the 28-day budget in <= 3 days ({{ $value }}x)."

      # ------------------------------------------------------------ S4
      - record: slo:S4:error_budget_consumed:ratio1h
        expr: |
          (1 - slo:S4:good_ratio:ratio1h) / 0.05
      - record: slo:S4:error_budget_consumed:ratio6h
        expr: |
          (1 - slo:S4:good_ratio:ratio6h) / 0.05
      - alert: SLOPE_BudgetBurn_Fast_S4
        expr: slo:S4:error_budget_consumed:ratio1h >= 1200
        for: 10m
        labels: { severity: page, slo: S4, runbook: docs/runbooks/slo-burn.md }
        annotations:
          summary: "S4 event-processing lag error budget burning fast"
          description: "Event lag p95 would exhaust the 28-day budget in <= 1h ({{ $value }}x)."
      - alert: SLOPE_BudgetBurn_Slow_S4
        expr: slo:S4:error_budget_consumed:ratio6h >= 9.3
        for: 2h
        labels: { severity: ticket, slo: S4, runbook: docs/runbooks/slo-burn.md }
        annotations:
          summary: "S4 event-processing lag error budget burning slowly"
          description: "Event lag p95 would exhaust the 28-day budget in <= 3 days ({{ $value }}x)."
