# alertmanager-slo.yml
#
# Alertmanager routing for SLO burn-rate alerts (docs/slo.md). Routes the
# page / ticket severity labels generated by slo-alerting-rules.yml to the
# alert pipeline (webhook) used by the operationally-instrumented backend.
#
# Merge this into the deployment Alertmanager config; keep the routes/severity
# mapping aligned with docs/alert-routing-policy.md.

global:
  # Receivers are illustrative; replace with the real incident webhook /
  # PagerDuty endpoint from the platform secret store.
  resolve_timeout: 5m

route:
  receiver: "reliability-dispatch"
  group_by: ["slo", "alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: page
      receiver: "slo-page"
      # Page immediately and keep re-notifying until acknowledged.
      group_wait: 0s
      repeat_interval: 1h
    - match:
        severity: ticket
      receiver: "slo-ticket"
      group_wait: 5m

receivers:
  - name: "reliability-dispatch"
    webhook_configs:
      - url: "https://ops.example.com/webhook/alerts"
  - name: "slo-page"
    webhook_configs:
      - url: "https://ops.example.com/webhook/slo-page"
        send_resolved: true
  - name: "slo-ticket"
    webhook_configs:
      - url: "https://ops.example.com/webhook/slo-ticket"
        send_resolved: true

inhibit_rules:
  - source_matchers: ["severity=page"]
    target_matchers: ["severity=ticket"]
    equal: ["slo"]
