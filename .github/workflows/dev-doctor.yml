name: Dev Doctor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
  pull_request:
    paths:
      - "scripts/dev-doctor.sh"
      - ".github/workflows/dev-doctor.yml"

jobs:
  bare-container:
    name: Doctor reports actionable hints on a bare machine
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: Doctor must fail with fix hints
        run: |
          set +e
          out=$(bash scripts/dev-doctor.sh --no-smoke 2>&1); code=$?
          echo "$out"
          [ "$code" -ne 0 ] || { echo "expected failure on bare container"; exit 1; }
          echo "$out" | grep -q "fix: nvm install 22" || { echo "missing node hint"; exit 1; }
          echo "$out" | grep -q "fix: curl --proto" || { echo "missing rustup hint"; exit 1; }

  provisioned:
    name: Doctor passes after following its hints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install dependencies and env files per doctor hints
        run: |
          for s in frontend backend mobile; do (cd $s && npm install --no-audit --no-fund --ignore-scripts); done
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env.local
      - name: Run doctor
        run: bash scripts/dev-doctor.sh --no-smoke
