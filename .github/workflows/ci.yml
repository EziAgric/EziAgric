name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/ci.yml"
      - "backend/**"
      - "frontend/**"
      - "mobile/**"
      - "contracts/**"
      - "scripts/**"
      - "infra/**"
      - "package-lock.json"
      - "pnpm-lock.yaml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/ci.yml"
      - "frontend/**"
      - "backend/**"
      - "contracts/**"
      - "scripts/**"
      - "infra/**"
      - "mobile/**"
      - "mobile/package-lock.json"
      - "pnpm-lock.yaml"

jobs:
  changes:
    name: Detect Changed Stacks
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'frontend/package-lock.json'
            backend:
              - 'backend/**'
              - 'backend/package-lock.json'
            mobile:
              - 'mobile/**'
              - 'mobile/package-lock.json'
            contracts:
              - 'contracts/**'
              - 'scripts/check-contract-deployment-safety.sh'

  validate-quarantine:
    name: Validate flaky-tests quarantine registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate quarantine registry (no expired entries)
        run: node scripts/validate-flaky-quarantine.mjs

  frontend:
    name: Frontend Required Gate
    runs-on: ubuntu-latest
    needs: [changes, validate-quarantine]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm lint

      - name: Build
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm build

      - name: Test
        if: needs.changes.outputs.frontend == 'true'
        # --json writes a machine-readable result file used by the flake reporter
        run: pnpm test -- --json --outputFile=jest-results.json || true

      - name: Detect flake candidates (frontend)
        if: needs.changes.outputs.frontend == 'true'
        run: |
          node ../scripts/flake-reporter.mjs \
            --results jest-results.json \
            --registry ../.github/flaky-tests-quarantine.json \
            --output ../reports/flake/frontend-${{ github.run_number }}.json \
            --scope frontend | tee -a $GITHUB_STEP_SUMMARY

      - name: Fail if tests failed (deferred from --json run)
        if: needs.changes.outputs.frontend == 'true'
        run: |
          node -e "
            const r = require('./jest-results.json');
            if (r.success === false || r.numFailedTests > 0) {
              console.error('Tests failed: ' + r.numFailedTests + ' failure(s)');
              process.exit(1);
            }
          "

      - name: A11y axe audit (blocking)
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm test -- src/__tests__/accessibility --verbose

      - name: Upload coverage report
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

      - name: Upload flake report (frontend)
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flake-report-frontend-${{ github.run_number }}
          path: reports/flake/frontend-${{ github.run_number }}.json
          retention-days: 30

      - name: Skip note (no frontend changes)
        if: needs.changes.outputs.frontend != 'true'
        run: echo "No frontend file changes detected, required gate passed."

  backend:
    name: Backend Required Gate
    runs-on: ubuntu-latest
    needs: [changes, validate-quarantine]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        if: needs.changes.outputs.backend == 'true'
        run: pnpm build

      - name: Test
        if: needs.changes.outputs.backend == 'true'
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-value-with-minimum-length-32
        # --json writes a machine-readable result file used by the flake reporter
        run: pnpm test -- --json --outputFile=jest-results.json || true

      - name: Detect flake candidates (backend)
        if: needs.changes.outputs.backend == 'true'
        run: |
          node ../scripts/flake-reporter.mjs \
            --results jest-results.json \
            --registry ../.github/flaky-tests-quarantine.json \
            --output ../reports/flake/backend-${{ github.run_number }}.json \
            --scope backend | tee -a $GITHUB_STEP_SUMMARY

      - name: Fail if tests failed (deferred from --json run)
        if: needs.changes.outputs.backend == 'true'
        run: |
          node -e "
            const r = require('./jest-results.json');
            if (r.success === false || r.numFailedTests > 0) {
              console.error('Tests failed: ' + r.numFailedTests + ' failure(s)');
              process.exit(1);
            }
          "

      - name: Upload flake report (backend)
        if: needs.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flake-report-backend-${{ github.run_number }}
          path: reports/flake/backend-${{ github.run_number }}.json
          retention-days: 30

      - name: Enforce Admin Regression Test Policy
        if: needs.changes.outputs.backend == 'true'
        run: |
          chmod +x ../scripts/check-admin-test-coverage.sh
          ../scripts/check-admin-test-coverage.sh

      - name: Admin auth regression suite
        if: needs.changes.outputs.backend == 'true'
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-value-with-minimum-length-32
        run: pnpm jest --config jest.config.js --forceExit --detectOpenHandles --testPathPatterns='admin\.auth\.ci-regression' --verbose

      - name: Validate admin OpenAPI docs
        if: needs.changes.outputs.backend == 'true'
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-value-with-minimum-length-32
        run: pnpm jest --config jest.config.js --forceExit --detectOpenHandles --testPathPatterns='openapi\.(drift|docs)\.test' --verbose

      - name: Upload coverage report
        if: needs.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

      - name: Skip note (no backend changes)
        if: needs.changes.outputs.backend != 'true'
        run: echo "No backend file changes detected, required gate passed."

  mobile:
    name: Mobile Required Gate
    runs-on: ubuntu-latest
    needs: [changes, validate-quarantine]
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        if: needs.changes.outputs.mobile == 'true'
        run: pnpm install --frozen-lockfile

      - name: Type check
        if: needs.changes.outputs.mobile == 'true'
        run: pnpm type-check

      - name: Lint
        if: needs.changes.outputs.mobile == 'true'
        run: pnpm lint

      - name: Skip note (no mobile changes)
        if: needs.changes.outputs.mobile != 'true'
        run: echo "No mobile file changes detected, required gate passed."

  contracts:
    name: Contracts Required Gate
    runs-on: ubuntu-latest
    needs: [changes, validate-quarantine]
    defaults:
      run:
        working-directory: contracts/amana_escrow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo-audit binary
        if: needs.changes.outputs.contracts == 'true'
        id: cache-cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.22

      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Security audit (cargo)
        working-directory: contracts
        run: cargo audit

      - name: Deployment safety checks
        if: needs.changes.outputs.contracts == 'true'
        run: ../../scripts/check-contract-deployment-safety.sh

      - name: Test
        if: needs.changes.outputs.contracts == 'true'
        run: cargo test --locked

      - name: Build WASM artifact
        if: needs.changes.outputs.contracts == 'true'
        run: cargo build --target wasm32-unknown-unknown --features wasm --release

      - name: Verify WASM ABI hash
        if: needs.changes.outputs.contracts == 'true'
        run: |
          WASM_FILE="target/wasm32-unknown-unknown/release/amana_escrow.wasm"
          if [ -f "$WASM_FILE" ]; then
            WASM_HASH=$(sha256sum "$WASM_FILE" | cut -d' ' -f1)
            echo "WASM ABI hash: $WASM_HASH"
            echo "WASM_ABI_HASH=$WASM_HASH" >> $GITHUB_ENV
          else
            echo "ERROR: WASM artifact not found at $WASM_FILE"
            exit 1
          fi

      - name: Skip note (no contract changes)
        if: needs.changes.outputs.contracts != 'true'
        run: echo "No contract file changes detected, required gate passed."
