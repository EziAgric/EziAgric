# Runner pinned to ubuntu-24.04 (not ubuntu-latest) so runner upgrades are explicit.
# Revisit when GitHub deprecates ubuntu-24.04 or a newer LTS is needed; bump all workflows together.
name: Container Scan

# Trivy scanning for container images and IaC (issue #206).
# Blocks merge on fixable CRITICAL CVEs in the third-party base images the
# project runs, and on HIGH/CRITICAL IaC misconfiguration. Exceptions live in
# .trivyignore with a `# expires: YYYY-MM-DD` marker per entry.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/container-scan.yml"
      - ".trivyignore"
      - "docker-compose.yml"
      - "infra/**"
      - "**/Dockerfile"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/container-scan.yml"
      - ".trivyignore"
      - "docker-compose.yml"
      - "infra/**"
      - "**/Dockerfile"
  schedule:
    # Weekly — Monday 06:30 UTC.
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  trivyignore-expiry:
    name: Validate .trivyignore expiry markers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node scripts/check-trivyignore-expiry.mjs

  image-scan:
    name: Image scan (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: trivyignore-expiry
    strategy:
      fail-fast: false
      matrix:
        # Third-party base images the compose/k8s stacks run.
        image:
          - postgres:17-alpine
          - redis:7-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy image scan — block on fixable CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          output: trivy-${{ strategy.job-index }}.txt

      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-image-${{ strategy.job-index }}
          path: trivy-${{ strategy.job-index }}.txt
          retention-days: 30

  backend-image-scan:
    name: Backend application image scan
    runs-on: ubuntu-24.04
    needs: trivyignore-expiry
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --target runtime -t backend-scan:ci ./backend

      - name: Trivy scan — backend application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: backend-scan:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          output: trivy-backend.txt

      - name: Upload backend scan output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-backend
          path: trivy-backend.txt
          retention-days: 30

  iac-scan:
    name: IaC misconfig scan (compose + k8s)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: trivyignore-expiry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy config scan — compose
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: docker-compose.yml
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Trivy config scan — k8s manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/k8s
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

  posture-report:
    name: Image posture report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: trivyignore-expiry
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Full posture scan (all severities, JSON)
        run: |
          mkdir -p security-reports
          for img in postgres:17-alpine redis:7-alpine; do
            safe=$(echo "$img" | tr '/:' '__')
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --quiet --format json --output "/dev/stdout" "$img" \
              > "security-reports/${safe}.json" || true
          done
          ls -la security-reports

      - name: Upload posture report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-posture-report
          path: security-reports/
          retention-days: 90
