# Runner pinned to ubuntu-24.04 (not ubuntu-latest) so runner upgrades are explicit.
# Revisit when GitHub deprecates ubuntu-24.04 or a newer LTS is needed; bump all workflows together.
name: Secrets Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  gitleaks:
    name: Gitleaks (blocking)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_EXIT_CODE: "1"
