name: Release

# Automated releases from Conventional Commit history (issue #270).
#
# - workflow_dispatch: computes the next semver version from commit types since
#   the last `v*` tag (breaking → major, feat → minor, otherwise patch), tags
#   the selected ref and publishes the release.
# - push of a `v*` tag: publishes the release for that tag.
#
# Notes are generated by scripts/release-notes.mjs, attached to the GitHub
# release and archived as a workflow artifact.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 1.4.0). Leave empty to derive it from commit types."
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            FROM=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)
          else
            FROM=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
            if [ -n "$INPUT_VERSION" ]; then
              VERSION="${INPUT_VERSION#v}"
            else
              VERSION=$(node scripts/release-notes.mjs --next-version ${FROM:+--from "$FROM"} --to HEAD)
            fi
            if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
              echo "::error::Invalid version '$VERSION'. Expected semver like 1.4.0"
              exit 1
            fi
            TAG="v${VERSION}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "::error::Tag ${TAG} already exists"
              exit 1
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "from=${FROM}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} (previous: ${FROM:-none})"

      - name: Generate release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          FROM: ${{ steps.version.outputs.from }}
        run: |
          TO=HEAD
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TO="$TAG"; fi
          node scripts/release-notes.mjs ${FROM:+--from "$FROM"} --to "$TO" --version "$TAG" --out release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create tag
        if: github.ref_type != 'tag'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Archive release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ steps.version.outputs.tag }}
          path: release-notes.md
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          FLAGS=""
          if [ "$PRERELEASE" = "true" ] || echo "$TAG" | grep -q -- '-'; then FLAGS="--prerelease"; fi
          cp release-notes.md "release-notes-${TAG}.md"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            $FLAGS \
            "release-notes-${TAG}.md"
