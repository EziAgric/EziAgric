name: Bug report
description: Report something that is broken or behaves unexpectedly.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please read [CONTRIBUTING.md](https://github.com/EziAgric/EziAgric/blob/main/CONTRIBUTING.md) first.
        Wave issues must state an **area**, a **complexity** level and **acceptance criteria**.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the stack is affected?
      options:
        - Backend
        - Frontend
        - Mobile
        - Contracts
        - DevOps
        - Docs
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Complexity
      description: Drips Wave complexity level. Maintainers may adjust it before the issue is resolved.
      options:
        - Trivial (100 points) — Typos, minor copy changes, or very small, well-contained fixes.
        - Medium (150 points) — Standard features or fixes touching a few files.
        - High (200 points) — Complex features, cross-cutting changes or deep investigation.
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Relevant files
      description: Paths to files, workflows or modules involved.
      placeholder: "- `backend/src/...`"

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist that must be true for this issue to be closed.
      value: |
        - [ ] Bug no longer reproduces
        - [ ] Regression test added
        - [ ] All relevant CI gates pass (see README → *Required PR CI Gates*)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment / logs
      description: Versions, OS, browser/device, relevant log output.
      render: shell
